<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMRS RS Nusa Medika</title>
<style>
:root{--bg:#f2f3f5;--cd:#fff;--tx:#1a2233;--mut:#6b7280;--pri:#2a4bd7;--bd:#eceef2;--side:#253a8a;--sh:0 1px 4px rgba(20,30,60,.12);--wbg:#fef3c7;--wtx:#92400e;--ibg:#dbeafe;--itx:#1e40af;--okbg:#dcfce7;--ok:#166534;--rg:#eefbf2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--cd:#18202f;--tx:#e6ebf5;--mut:#9aa6bb;--pri:#5b7bff;--bd:#27324a;--side:#16224f;--wbg:#78350f;--wtx:#fde68a;--ibg:#1e3a8a;--itx:#bfdbfe;--okbg:#14532d;--ok:#86efac;--rg:#12301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--cd:#18202f;--tx:#e6ebf5;--mut:#9aa6bb;--pri:#5b7bff;--bd:#27324a;--side:#16224f;--wbg:#78350f;--wtx:#fde68a;--ibg:#1e3a8a;--itx:#bfdbfe;--okbg:#14532d;--ok:#86efac;--rg:#12301f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif}
h2{margin:0;font-size:26px}h3{margin:0;font-size:17px}.m{color:var(--mut);margin:4px 0 20px;font-size:17px}small{display:block;color:var(--mut);font-size:13px}a{cursor:pointer}
.lay{display:flex;min-height:100vh}nav{width:230px;background:var(--side);padding:12px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}.br{color:#fff;font-weight:700;padding:8px 12px 14px;font-size:17px}
nav a{display:flex;gap:12px;align-items:center;color:#dfe6ff;padding:11px 14px;border-radius:10px;font-weight:500}nav a:hover{background:rgba(255,255,255,.1)}nav a.on{background:rgba(255,255,255,.2);color:#fff}.sp{flex:1}
.us{color:#dfe6ff;padding:10px 12px;border-top:1px solid rgba(255,255,255,.2);font-size:13px}.us small{color:#aeb9e6}.us a{display:block;padding:4px 0;color:#aeb9e6}
main{flex:1;padding:26px 30px;min-width:0}
.cd{background:var(--cd);border-radius:14px;box-shadow:var(--sh);overflow:hidden}.sc{padding:16px 20px}.sc b{display:block;font-size:34px;line-height:1.2}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}.g2,.g2f{display:grid;gap:18px;grid-template-columns:1fr 1fr;align-items:start}.g2f{grid-template-columns:2fr 1fr}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:18px 20px;flex-wrap:wrap}
.it{display:flex;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--bd);align-items:flex-start}.it b{display:block;font-size:16px}.it span{display:flex;gap:10px;align-items:center;flex-shrink:0}
.em{text-align:center;color:var(--mut);padding:36px 10px;margin:0}.id{font-family:ui-monospace,Menlo,monospace;color:#5b3fd4;font-size:14px}a.or{color:#d95f2b}.id.or{color:#c2410c}
.bl{color:#2f55d4}.am{color:#b7791f}.gr{color:#2f9e4f}.gy{color:var(--tx)}.rd{color:#d03a3a}.pu{color:#7c3aed}.tl{color:#2f7f94}small.rd{color:#d03a3a}small.gr{color:#2f9e4f}
.tg{padding:2px 11px;border-radius:99px;font-size:13px;background:var(--ibg);color:var(--itx)}.tg.menunggu{background:var(--wbg);color:var(--wtx)}.tg.selesai{background:var(--okbg);color:var(--ok)}
.lk{color:var(--pri)}.b,.b2{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font:inherit;font-weight:500;color:#fff;background:var(--pri)}.b2{background:var(--bd);color:var(--tx)}.b.tb{background:#3f9488}.b.or{background:#d95f2b}.b.gn{background:#43a05a}.b.rb{background:#d63649}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}textarea{min-height:56px}label{display:block;font-size:13px;color:var(--mut);margin-top:8px}label input,label select,label textarea{margin-top:3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.row select{flex:1;min-width:150px}.ck{display:flex;gap:6px;align-items:center;margin:0}.ck input{width:auto}
.sx{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 20px;border-top:1px solid var(--bd);white-space:nowrap}th{font-size:13px;color:var(--mut);background:var(--bg)}.sr{max-width:340px}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}.mb{background:var(--cd);border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow:auto;padding:20px}.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#ts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 18px;border-radius:8px;display:none;z-index:30}
.lw{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#1c2c6b,#2a4bd7)}.lc{background:var(--cd);border-radius:14px;padding:28px;width:100%;max-width:400px}.lc h1{margin:8px 0 0;font-size:22px}.lc h3{margin-top:18px}.logo{width:46px;height:46px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:24px}.er{color:#d03a3a;min-height:20px;margin:6px 0}
.demo{margin-top:16px;border-top:1px solid var(--bd);padding-top:10px;font-size:13px}.demo div{padding:4px 0;cursor:pointer}.demo div:hover{color:var(--pri)}.lc .m{font-size:14px;margin:6px 0}
@media(max-width:800px){.lay{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;align-items:center}nav a{white-space:nowrap}.br,.us,.sp{display:none}.g2,.g2f{grid-template-columns:1fr}main{padding:18px 14px}}
</style></head><body><div id="app"></div><div id="mo"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),H='Nusa Medika';
const USERS=[['admin','Administrator','Administrator'],['dr.ahmad','dr. Ahmad Fauzi, Sp.PD','Dokter'],['admisi01','Siti Rahma','Admisi'],['perawat01','Ns. Budi Santoso','Perawat'],['apt.sari','apt. Sari Dewi','Apoteker'],['lab01','Rina Analis','Laboratorium'],['kasir01','Dewi Kasir','Kasir']];
const DOK=['dr. Ahmad Fauzi, Sp.PD','dr. Sinta Dewi, Sp.A','dr. Maya Lestari'],POLI=['Poli Umum','Poli Penyakit Dalam','Poli Anak','Poli Gigi','IGD'];
const MENU={Administrator:['daftar','rekam','cpoe','lab','farmasi','inap','billing'],Dokter:['rekam','cpoe','inap'],Admisi:['daftar'],Perawat:['rekam','inap'],Apoteker:['farmasi'],Laboratorium:['lab'],Kasir:['billing']};
const LBL={daftar:['👤','Pendaftaran'],rekam:['📄','Rekam Medis'],cpoe:['📋','CPOE / Order'],lab:['🧪','Laboratorium'],farmasi:['💊','Farmasi'],inap:['🏠','Rawat Inap'],billing:['💳','Billing']};
const TESTS={'Darah Lengkap (CBC)':85000,'Gula Darah Puasa':35000,'Profil Lipid':60000,'Urinalisis':45000,'Rontgen Thorax':150000};
const KLS={VIP:[2,1500000,'pu'],I:[4,800000,'bl'],II:[8,500000,'tl'],III:[12,250000,'gr']};
const AL={penisilin:['amoxicillin']};
let db,me,page='',sub='',mok;
const td=()=>new Date().toLocaleDateString('sv-SE'),ago=n=>new Date(Date.now()-n*864e5).toLocaleDateString('sv-SE'),now=()=>new Date().toLocaleString('sv-SE').slice(0,16);
const fd=s=>s.slice(0,10).split('-').reverse().join('/'),fdt=s=>s.slice(8,10)+'/'+s.slice(5,7)+' '+s.slice(11);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+n.toLocaleString('id-ID'),val=id=>$('#'+id).value.trim(),age=p=>Math.floor((Date.now()-new Date(p.lahir))/31557600000);
const vt=id=>db.visits.find(v=>v.id==id),pt=id=>db.patients.find(p=>p.id==id),pv=v=>pt(v.pid),pn=v=>pv(v).nama,price=n=>(db.drugs.find(d=>d.n==n)||{p:0}).p;
const hari=v=>Math.max(1,Math.round((Date.now()-new Date(v.inap.masuk))/864e5)),kl=r=>r.split('-')[0];
function seed(){const P=(i,nama,jk,lahir,alergi='')=>({id:'RM-2026-'+String(i).padStart(5,'0'),nama,jk,lahir,alergi,nik:'',hp:'',alamat:'',tgl:ago(30)});
const d={c:{kj:6,rx:4,lab:3,bil:1},drugs:[{n:'Paracetamol 500mg',s:200,p:2000},{n:'Amoxicillin 500mg',s:150,p:5000},{n:'Omeprazole 20mg',s:100,p:7000},{n:'Cetirizine 10mg',s:120,p:3000},{n:'Antasida Doen',s:180,p:1500},{n:'Dexamethasone 0.5mg',s:8,p:1000}],patients:[P(1,'Irfan Wijaya','L','1996-03-12'),P(2,'Diana Wijaya','P','2019-06-20','Seafood'),P(3,'Ratna Anggraini','P','1988-09-02','Penisilin'),P(4,'Wulan Susanti','P','1961-01-15')],visits:[],rx:[],lab:[],bil:[]};
const mk=(n,pid,poli,dok,st,x={})=>d.visits.push({id:'KJ-2026-'+String(n).padStart(5,'0'),pid,poli,dok,st,tgl:td(),vit:null,soap:null,...x}),dg=a=>({a,p:'Kontrol bila keluhan berlanjut'});
mk(1,'RM-2026-00001','Poli Penyakit Dalam',DOK[0],'selesai',{soap:dg('Dispepsia')});mk(2,'RM-2026-00002','Poli Anak',DOK[1],'selesai',{soap:dg('ISPA')});mk(3,'RM-2026-00003','Poli Penyakit Dalam',DOK[0],'selesai',{soap:dg('Faringitis')});
mk(4,'RM-2026-00004','Poli Penyakit Dalam',DOK[0],'rawat',{soap:dg('Pneumonia'),inap:{room:'I-02',masuk:ago(5),notes:[{at:now(),txt:'Kondisi stabil, tanda vital dalam batas normal.'}]}});mk(5,'RM-2026-00001','Poli Umum',DOK[2],'menunggu');
const r=(id,vid,drug,qty,atur,st)=>d.rx.push({id:'RX-'+id,vid,items:[{drug,qty,atur}],st,at:now()});r(1,'KJ-2026-00001','Omeprazole 20mg',10,'1 x 1 sebelum makan','menunggu');r(2,'KJ-2026-00002','Paracetamol 500mg',10,'3 x 1 sesudah makan','selesai');r(3,'KJ-2026-00003','Amoxicillin 500mg',15,'3 x 1 sesudah makan','diproses');
d.lab.push({id:'LAB-1',vid:'KJ-2026-00001',test:'Darah Lengkap (CBC)',st:'menunggu',res:'',at:now()},{id:'LAB-2',vid:'KJ-2026-00002',test:'Profil Lipid',st:'selesai',res:'Hasil dalam batas rujukan, kecuali yang dicatat dokter.',at:now()});return d}
function load(){try{db=JSON.parse(localStorage.getItem('nm_db2'))}catch(e){}if(!db)db=seed();try{me=JSON.parse(sessionStorage.getItem('nm_me'))}catch(e){}}
const save=()=>{try{localStorage.setItem('nm_db2',JSON.stringify(db))}catch(e){}};
function login(u,p){const x=USERS.find(a=>a[0]==u.trim());if(!x||p!=='password'){$('#err').textContent='Username atau password salah.';return}me={u:x[0],nama:x[1],role:x[2]};try{sessionStorage.setItem('nm_me',JSON.stringify(me))}catch(e){}page=MENU[me.role][0];sub='';render()}
function logout(){me=null;try{sessionStorage.removeItem('nm_me')}catch(e){}render()}
const go=k=>{page=k;sub='';render()};
function M(t,body,ok,lbl='Simpan'){$('#mo').innerHTML=`<div class="ov2" onclick="if(event.target==this)X()"><div class="mb"><h3>${t}</h3><div>${body}</div><div class="ma"><button class="b2" onclick="X()">Batal</button>${ok?`<button class="b" onclick="mok()">${lbl}</button>`:''}</div></div></div>`;mok=ok}
const X=()=>{$('#mo').innerHTML=''};
function T(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(T.h);T.h=setTimeout(()=>t.style.display='none',2600)}
const fi=(id,l,a='')=>`<label>${l}<input id="${id}" ${a}></label>`,sel=(id,l,o)=>`<label>${l}<select id="${id}">${o.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></label>`;
const dt=()=>{const d=new Date();return `<p class="m">${d.toLocaleDateString('en-US',{weekday:'long'})}, ${d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p>`};
const sc=(l,v,c)=>`<div class="cd sc"><small>${l}</small><b class="${c}">${v}</b></div>`,bd=s=>`<span class="tg ${s}">${s}</span>`,ls=(l,e)=>l.length?l.join(''):`<p class="em">${e}</p>`;
const drugOpt=()=>'<option value="">— tanpa obat —</option>'+db.drugs.map(d=>`<option>${d.n}</option>`).join('');
const loginV=()=>`<div class="lw"><div class="lc"><div class="logo">✚</div><h1>RS ${H}</h1><p class="m">Sistem Informasi Manajemen Rumah Sakit (SIMRS)</p><h3>Masuk ke Sistem</h3><label>Username<input id="u" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login($('#u').value,$('#p').value)"></label><div id="err" class="er"></div><button class="b" style="width:100%" onclick="login($('#u').value,$('#p').value)">Masuk ke Sistem</button><p class="m">Lupa password? Hubungi <a class="lk" href="mailto:it@nusamedika.id">Admin IT</a></p><div class="demo"><b>Akun Demo (Mode Pengembangan)</b>${USERS.map(a=>`<div onclick="login('${a[0]}','password')">👤 ${a[0]} → ${a[2]}</div>`).join('')}<small>Password semua: password</small></div><p class="m" style="font-size:12px;margin-bottom:0">SIMRS v1.0 © 2026 RS ${H}</p></div></div>`;
const shell=c=>`<div class="lay"><nav><div class="br">✚ RS ${H}</div>${MENU[me.role].map(k=>`<a class="${k==page?'on':''}" onclick="go('${k}')"><span>${LBL[k][0]}</span>${LBL[k][1]}</a>`).join('')}<div class="sp"></div><div class="us"><b>${esc(me.nama)}</b><small>${me.role}</small>${me.role=='Administrator'?'<a onclick="rst()">Reset data demo</a>':''}<a onclick="logout()">Keluar</a></div></nav><main>${c}</main></div>`;
const V={};
const qrow=v=>`<div class="it"><div><b>${esc(pn(v))}</b><small>${v.pid} | ${v.id}</small><small>${v.poli} · ${esc(v.dok)}</small></div>${bd(v.st)}</div>`;
V.daftar=()=>{if(sub=='pasien')return pasienV();const t=db.visits.filter(v=>v.tgl==td());return `<h2>Dashboard Pendaftaran</h2>${dt()}<div class="g4">${sc('Pasien Baru',db.patients.filter(p=>p.tgl==td()).length,'bl')}${sc('Menunggu',t.filter(v=>v.st=='menunggu').length,'am')}${sc('Selesai Hari Ini',t.filter(v=>v.st=='selesai').length,'gr')}${sc('Total Kunjungan',db.visits.length,'gy')}</div><div class="cd"><div class="ch"><h3>Antrian Hari Ini — ${fd(td())}</h3><span><a class="lk" onclick="sub='pasien';render()">Data Pasien</a> &nbsp;|&nbsp; <button class="b" onclick="fKunj()">+ Daftar Kunjungan</button></span></div>${ls(t.map(qrow),'Belum ada kunjungan hari ini.')}</div>`};
const pasienV=()=>`<h2>Data Pasien</h2><p class="m"><a class="lk" onclick="sub='';render()">← Kembali ke Pendaftaran</a></p><div class="cd"><div class="ch"><input class="sr" placeholder="Cari nama atau No. RM" oninput="filt(this.value)"><button class="b" onclick="fPas()">+ Pasien Baru</button></div><div class="sx"><table id="tp"><tr><th>No. RM</th><th>Nama</th><th>JK</th><th>Umur</th><th>Alergi</th><th>HP</th></tr>${db.patients.map(p=>`<tr><td>${p.id}</td><td>${esc(p.nama)}</td><td>${p.jk}</td><td>${age(p)} th</td><td>${esc(p.alergi)||'-'}</td><td>${esc(p.hp)}</td></tr>`).join('')}</table></div></div>`;
const filt=q=>document.querySelectorAll('#tp tr:not(:first-child)').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none');
function fPas(){M('Pasien Baru',`<div class="fg">${fi('n_nama','Nama lengkap')}${fi('n_lahir','Tanggal lahir','type="date"')}${sel('n_jk','Jenis kelamin',[['L','Laki-laki'],['P','Perempuan']])}${fi('n_nik','NIK')}${fi('n_hp','No. HP')}${fi('n_alergi','Alergi (jika ada)')}</div>${fi('n_alamat','Alamat')}`,()=>{if(!val('n_nama')||!val('n_lahir')){T('Nama dan tanggal lahir wajib diisi');return}db.patients.push({id:'RM-2026-'+String(db.patients.length+1).padStart(5,'0'),nama:val('n_nama'),jk:val('n_jk'),lahir:val('n_lahir'),nik:val('n_nik'),hp:val('n_hp'),alamat:val('n_alamat'),alergi:val('n_alergi'),tgl:td()});save();X();T('Pasien disimpan');render()})}
function fKunj(){M('Daftar Kunjungan',`<div class="fg">${sel('f_p','Pasien',db.patients.map(p=>[p.id,p.id+' — '+p.nama]))}${sel('f_o','Poli',POLI.map(x=>[x,x]))}${sel('f_d','Dokter',DOK.map(x=>[x,x]))}</div>`,()=>{db.visits.push({id:'KJ-2026-'+String(db.c.kj++).padStart(5,'0'),pid:val('f_p'),poli:val('f_o'),dok:val('f_d'),st:'menunggu',tgl:td(),vit:null,soap:null});save();X();T('Kunjungan didaftarkan');render()},'Daftarkan')}
V.rekam=()=>{const t=db.visits.filter(v=>v.tgl==td()&&v.st=='menunggu'),h=db.visits.filter(v=>v.soap).slice(-10).reverse();return `<h2>Antrian Pasien — Rekam Medis</h2>${dt()}<div class="cd"><div class="ch"><h3>Antrian Hari Ini — ${fd(td())}</h3><small>${t.length} pasien</small></div>${ls(t.map(v=>`<div class="it"><div><b>${esc(pn(v))}</b><small>${v.pid} | ${v.id}</small><small>${v.poli} · ${esc(v.dok)}</small></div><button class="b" onclick="periksa('${v.id}')">Periksa</button></div>`),'Tidak ada pasien dalam antrian saat ini.')}</div><div class="cd" style="margin-top:18px"><div class="ch"><h3>Riwayat Rekam Medis</h3></div>${ls(h.map(v=>`<div class="it"><div><b>${esc(pn(v))}</b><small>${v.id} · ${fd(v.tgl)} · ${esc(v.dok)}</small><small>Diagnosis: ${esc(v.soap.a)}${v.vit?' · TD '+esc(v.vit.td)+' · Suhu '+esc(v.vit.suhu)+'°C':''}</small></div></div>`),'Belum ada rekam medis.')}</div>`};
function periksa(id){const v=vt(id);M('Pemeriksaan — '+esc(pn(v)),`<div class="fg">${fi('x_td','Tekanan darah (mmHg)')}${fi('x_nadi','Nadi (x/menit)')}${fi('x_suhu','Suhu (°C)')}${fi('x_bb','Berat badan (kg)')}</div><label>Keluhan utama<textarea id="x_kel"></textarea></label><label>Diagnosis<textarea id="x_a"></textarea></label><label>Terapi / anjuran<textarea id="x_p"></textarea></label><label>Resep</label>${[0,1].map(i=>`<div class="row"><select id="r${i}d">${drugOpt()}</select><input id="r${i}q" type="number" min="1" value="1" style="width:70px"><input id="r${i}a" placeholder="Aturan pakai" style="flex:1"></div>`).join('')}<label>Order laboratorium</label><div class="row">${Object.keys(TESTS).map(t=>`<label class="ck"><input type="checkbox" class="lt" value="${t}">${t}</label>`).join('')}</div><div class="row"><label class="ck"><input type="checkbox" id="x_inap"> Rawat inap</label>${sel('x_k','',Object.keys(KLS).map(k=>[k,'Kelas '+k]))}</div>`,()=>{if(!val('x_a')){T('Diagnosis wajib diisi');return}
v.vit={td:val('x_td'),nadi:val('x_nadi'),suhu:val('x_suhu'),bb:val('x_bb'),kel:val('x_kel')};v.soap={a:val('x_a'),p:val('x_p')};
const it=[0,1].filter(i=>$('#r'+i+'d').value).map(i=>({drug:$('#r'+i+'d').value,qty:Math.max(1,+$('#r'+i+'q').value||1),atur:val('r'+i+'a')||'sesuai anjuran'}));if(it.length)db.rx.push({id:'RX-'+db.c.rx++,vid:v.id,items:it,st:'menunggu',at:now()});
document.querySelectorAll('.lt:checked').forEach(c=>db.lab.push({id:'LAB-'+db.c.lab++,vid:v.id,test:c.value,st:'menunggu',res:'',at:now()}));
if($('#x_inap').checked){v.inap={room:freeRoom($('#x_k').value),masuk:td(),notes:[]};v.st='rawat'}else v.st='selesai';save();X();T('Pemeriksaan disimpan');render()})}
const rooms=()=>Object.entries(KLS).flatMap(([k,[n]])=>Array.from({length:n},(_,i)=>k+'-'+String(i+1).padStart(2,'0'))),occ=()=>db.visits.filter(v=>v.st=='rawat'&&v.inap&&v.inap.room),freeRoom=k=>rooms().find(r=>kl(r)==k&&!occ().some(v=>v.inap.room==r))||null;
const rxRow=r=>{const v=vt(r.vid),p=pv(v);return `<div class="it"><div><a class="id">${r.id}</a><b>${esc(p.nama)}</b><small>${p.id} · ${v.id} · ${fd(v.tgl)}</small><small>${v.poli} · ${r.items.length} item</small></div><span>${r.st=='menunggu'?`<a class="lk" onclick="eOrd('rx','${r.id}')">Edit</a>`:''}${bd(r.st)}</span></div>`},
labRow=l=>{const v=vt(l.vid),p=pv(v);return `<div class="it"><div><a class="id">${l.id}</a><b>${l.test}</b><small>${esc(p.nama)} · ${p.id} · ${v.id}</small>${l.res?`<small class="gr">Hasil: ${esc(l.res)}</small>`:''}</div><span>${l.st=='menunggu'?`<a class="lk" onclick="eOrd('lab','${l.id}')">Edit</a>`:''}${bd(l.st)}</span></div>`};
V.cpoe=()=>`<div class="ch" style="padding:0"><h2>CPOE — Daftar Order</h2><button class="b" onclick="fOrd()">+ Order Baru</button></div>${dt()}<div class="g2"><div class="cd"><div class="ch"><h3>Order Resep</h3></div>${ls(db.rx.slice().reverse().map(rxRow),'Belum ada order resep.')}</div><div class="cd"><div class="ch"><h3>Order Laboratorium</h3></div>${ls(db.lab.slice().reverse().map(labRow),'Belum ada order laboratorium.')}</div></div>`;
function fOrd(){M('Order Baru',`${sel('o_v','Kunjungan',db.visits.slice().reverse().slice(0,40).map(v=>[v.id,v.id+' — '+pn(v)]))}${sel('o_l','Order laboratorium',[['','— tanpa lab —'],...Object.keys(TESTS).map(t=>[t,t])])}<label>Order resep<select id="o_d">${drugOpt()}</select></label><div class="fg">${fi('o_q','Jumlah','type="number" min="1" value="1"')}${fi('o_a','Aturan pakai')}</div>`,()=>{const v=val('o_v');if(!v||(!val('o_l')&&!val('o_d'))){T('Pilih order lab atau resep');return}if(val('o_l'))db.lab.push({id:'LAB-'+db.c.lab++,vid:v,test:val('o_l'),st:'menunggu',res:'',at:now()});if(val('o_d'))db.rx.push({id:'RX-'+db.c.rx++,vid:v,items:[{drug:val('o_d'),qty:Math.max(1,+val('o_q')||1),atur:val('o_a')||'sesuai anjuran'}],st:'menunggu',at:now()});save();X();T('Order dibuat');render()})}
function eOrd(k,id){if(k=='lab'){const l=db.lab.find(x=>x.id==id);M('Edit '+id,sel('e_t','Pemeriksaan',Object.keys(TESTS).map(t=>[t,t])),()=>{l.test=val('e_t');save();X();render()});$('#e_t').value=l.test}else{const r=db.rx.find(x=>x.id==id),i=r.items[0];M('Edit '+id,fi('e_q','Jumlah ('+esc(i.drug)+')','type="number" min="1" value="'+i.qty+'"')+fi('e_a','Aturan pakai','value="'+esc(i.atur)+'"'),()=>{i.qty=Math.max(1,+val('e_q')||1);i.atur=val('e_a');save();X();render()})}}
V.lab=()=>{const w=db.lab.filter(l=>l.st=='menunggu'),dn=db.lab.filter(l=>l.st=='selesai');return `<h2>Dashboard Laboratorium</h2>${dt()}<div class="g4">${sc('Menunggu Pemeriksaan',w.length,'am')}${sc('Selesai Hari Ini',dn.filter(l=>(l.done||l.at).slice(0,10)==td()).length,'gr')}</div><div class="g2"><div class="cd"><div class="ch"><h3>Order Menunggu Pemeriksaan</h3>${w.length?`<span class="tg menunggu">${w.length} order</span>`:''}</div>${ls(w.map(l=>{const v=vt(l.vid),p=pv(v);return `<div class="it"><div><a class="id tl">${l.id}</a> <small style="display:inline">${fdt(l.at)}</small><b class="tl">${l.test}</b><small>${esc(p.nama)} · ${age(p)}th · ${p.jk}</small><small>${p.id} | ${v.id}</small><small>Dokter: ${esc(v.dok)}</small></div><button class="b tb" onclick="fHasil('${l.id}')">Input Hasil</button></div>`}),'Tidak ada order menunggu.')}</div><div class="cd"><div class="ch"><div><h3>Hasil Terbaru</h3><small>10 order terakhir yang selesai</small></div></div>${ls(dn.slice(-10).reverse().map(l=>{const v=vt(l.vid),p=pv(v);return `<div class="it"><div><a class="id tl">${l.id}</a><b>${l.test}</b><small>${esc(p.nama)} — ${p.id} — ${v.id}</small><small class="gr" style="background:var(--rg);padding:8px 12px;border-radius:6px;margin-top:6px">${esc(l.res)}</small></div><small>${fdt(l.done||l.at)}</small></div>`}),'Belum ada hasil.')}</div></div>`};
function fHasil(id){const l=db.lab.find(x=>x.id==id);M('Input Hasil — '+l.test,`<label>Hasil pemeriksaan<textarea id="h_r">Hasil dalam batas rujukan, kecuali yang dicatat dokter.</textarea></label>`,()=>{if(!val('h_r')){T('Isi hasil pemeriksaan');return}l.res=val('h_r');l.st='selesai';l.done=now();save();X();T('Hasil disimpan');render()})}
const risk=(p,r)=>r.items.filter(i=>(AL[(p.alergi||'').toLowerCase()]||[]).some(x=>i.drug.toLowerCase().includes(x))).map(i=>i.drug);
V.farmasi=()=>{if(sub=='stok')return stokV();const q=db.rx.filter(r=>r.st!='selesai'),n=s=>db.rx.filter(r=>r.st==s).length,lo=db.drugs.filter(d=>d.s<20);return `<h2>Dashboard Farmasi</h2>${dt()}<div class="g4">${sc('Menunggu Verifikasi',n('menunggu'),'am')}${sc('Sedang Diproses',n('diproses'),'bl')}${sc('Selesai Hari Ini',n('selesai'),'gr')}</div><div class="g2f"><div class="cd"><div class="ch"><h3>Antrian Resep</h3><a class="or" onclick="sub='stok';render()">Manajemen Stok Obat</a></div>${ls(q.map(r=>{const v=vt(r.vid),p=pv(v),rk=risk(p,r);return `<div class="it"><div><a class="id or">${r.id}</a> ${bd(r.st)}<b>${esc(p.nama)}</b><small>${p.id} | ${v.id}</small><small>${esc(v.dok)} · ${v.poli} · ${r.items.length} item obat</small>${p.alergi?`<small class="rd">⚠ Alergi: ${esc(p.alergi)}</small>`:''}${rk.length?`<small class="rd">⚠ Obat berisiko: ${esc(rk.join(', '))}</small>`:''}</div><button class="b or" onclick="stepRx('${r.id}')">${r.st=='menunggu'?'Proses':'Lanjut'}</button></div>`}),'Tidak ada resep dalam antrian.')}</div><div class="cd"><div class="ch"><h3>⚠ Stok Rendah</h3></div>${ls(lo.map(d=>`<div class="it"><span>${d.n}</span><b class="am" style="font-size:15px">${d.s} tablet</b></div>`),'Semua stok aman.')}</div></div>`};
function stepRx(id){const r=db.rx.find(x=>x.id==id);if(r.st=='menunggu'){r.st='diproses';save();render();return}for(const i of r.items){const d=db.drugs.find(x=>x.n==i.drug);if(d.s<i.qty){T('Stok '+d.n+' tidak cukup');return}}r.items.forEach(i=>db.drugs.find(x=>x.n==i.drug).s-=i.qty);r.st='selesai';r.done=now();save();T('Resep selesai, stok diperbarui');render()}
const stokV=()=>`<h2>Manajemen Stok Obat</h2><p class="m"><a class="or" onclick="sub='';render()">← Kembali ke Dashboard Farmasi</a></p><div class="cd sx"><table><tr><th>Obat</th><th>Stok</th><th>Harga</th><th></th></tr>${db.drugs.map((d,i)=>`<tr><td>${d.n}</td><td class="${d.s<20?'rd':''}"><b>${d.s}</b></td><td>${rp(d.p)}</td><td><button class="b or" onclick="db.drugs[${i}].s+=50;save();render()">+50</button></td></tr>`).join('')}</table></div>`;
V.inap=()=>{const o=occ(),w=db.visits.filter(v=>v.st=='rawat'&&v.inap&&!v.inap.room);return `<h2>Dashboard Rawat Inap</h2>${dt()}<div class="g4">${Object.entries(KLS).map(([k,[n,,c]])=>{const u=o.filter(v=>kl(v.inap.room)==k).length;return `<div class="cd sc"><small>Kelas ${k}</small><b class="${c}">${u}/${n}</b><small>${n-u} tempat kosong</small></div>`}).join('')}</div><div class="g2f"><div class="cd sx"><div class="ch"><h3>Pasien Rawat Inap Aktif (${o.length})</h3></div><table><tr><th>PASIEN</th><th>KAMAR</th><th>MASUK</th><th>HARI</th><th>AKSI</th></tr>${o.map(v=>{const p=pv(v),r=v.inap.room;return `<tr><td><b>${esc(p.nama)}</b><small>${p.id} | ${v.id}</small></td><td><b>${r}</b><small>Kelas ${kl(r)}</small></td><td>${fd(v.inap.masuk)}</td><td class="tl"><b>${hari(v)} hr</b></td><td><button class="b tb" onclick="fCat('${v.id}')">Catatan (${v.inap.notes.length})</button> <button class="b2" onclick="fOut('${v.id}')">Keluar</button></td></tr>`}).join('')}</table>${o.length?'':'<p class="em">Tidak ada pasien rawat inap.</p>'}</div><div class="cd"><div class="ch"><div><h3>Perlu Dirawat</h3><small>Kunjungan rawat inap belum punya kamar</small></div></div>${ls(w.map(v=>`<div class="it"><div><b>${esc(pn(v))}</b><small>${v.id}</small></div><button class="b" onclick="fPlace('${v.id}')">Tempatkan</button></div>`),'Tidak ada.')}</div></div>`};
function fCat(id){const v=vt(id);M('Catatan — '+esc(pn(v)),`${v.inap.notes.length?v.inap.notes.slice().reverse().map(n=>`<div class="it" style="padding:8px 0"><div><small>${fdt(n.at)}</small>${esc(n.txt)}</div></div>`).join(''):'<p class="em">Belum ada catatan.</p>'}<label>Catatan baru<textarea id="c_t"></textarea></label>`,()=>{if(!val('c_t')){T('Isi catatan');return}v.inap.notes.push({at:now(),txt:val('c_t')});save();X();render()},'Tambah catatan')}
function fOut(id){const v=vt(id);M('Pulangkan pasien',`${esc(pn(v))} akan dipulangkan dari kamar ${v.inap.room} dan tagihan dapat dibuat di Billing.`,()=>{v.inap.hari=hari(v);v.st='selesai';save();X();T('Pasien dipulangkan');render()},'Pulangkan')}
function fPlace(id){const v=vt(id);M('Tempatkan di kamar',sel('p_k','Kelas',Object.keys(KLS).map(k=>[k,'Kelas '+k])),()=>{const r=freeRoom(val('p_k'));if(!r){T('Kamar kelas ini penuh');return}v.inap.room=r;save();X();render()},'Tempatkan')}
const mkItems=v=>{const it=[];if(v.inap){const h=v.inap.hari||hari(v);it.push(['Kamar '+v.inap.room+' × '+h+' hari',KLS[kl(v.inap.room)][1]*h])}else it.push(['Konsultasi '+v.poli,50000]);db.rx.filter(r=>r.vid==v.id).forEach(r=>r.items.forEach(i=>it.push([i.drug+' × '+i.qty,i.qty*price(i.drug)])));db.lab.filter(l=>l.vid==v.id).forEach(l=>it.push(['Lab: '+l.test,TESTS[l.test]||0]));return it};
V.billing=()=>{const u=db.bil.filter(b=>b.st=='belum'),l=db.bil.filter(b=>b.st=='lunas'&&b.paid.slice(0,10)==td()),nb=db.visits.filter(v=>v.st=='selesai'&&!db.bil.some(b=>b.vid==v.id));return `<h2>Dashboard Billing &amp; Kasir</h2>${dt()}<div class="g4">${sc('Tagihan Belum Lunas',u.length,'rd')}${sc('Transaksi Lunas Hari Ini',l.length,'gr')}${sc('Pendapatan Hari Ini',rp(l.reduce((a,b)=>a+b.total,0)),'bl')}</div><div class="g2"><div class="cd"><div class="ch"><h3>Tagihan Menunggu Pembayaran</h3></div>${ls(u.map(b=>{const v=vt(b.vid),p=pv(v);return `<div class="it"><div><a class="id rd" style="color:#b4233a">${b.id}</a><b>${esc(p.nama)}</b><small>${p.id} | ${v.id} | ${v.poli}</small><b class="rd">${rp(b.total)}</b></div><button class="b gn" onclick="fBayar('${b.id}')">Proses Bayar</button></div>`}),'Tidak ada tagihan menunggu.')}</div><div class="cd"><div class="ch"><div><h3>Belum Dibuat Tagihan</h3><small>Kunjungan selesai yang belum punya tagihan</small></div></div>${ls(nb.map(v=>`<div class="it"><div><b>${esc(pn(v))}</b><small>${v.id} · ${v.poli}</small></div><button class="b rb" onclick="mkBill('${v.id}')">Buat Tagihan</button></div>`),'Semua kunjungan sudah ditagih.')}</div></div>`};
function mkBill(id){const it=mkItems(vt(id));db.bil.push({id:'BIL-'+db.c.bil++,vid:id,items:it,total:it.reduce((a,x)=>a+x[1],0),st:'belum',paid:''});save();T('Tagihan dibuat');render()}
function fBayar(id){const b=db.bil.find(x=>x.id==id),v=vt(b.vid),pend=db.rx.some(r=>r.vid==v.id&&r.st!='selesai')||db.lab.some(l=>l.vid==v.id&&l.st!='selesai');M('Pembayaran '+b.id,`<div class="sx"><table>${b.items.map(x=>`<tr><td>${esc(x[0])}</td><td style="text-align:right">${rp(x[1])}</td></tr>`).join('')}<tr><th>Total</th><th style="text-align:right">${rp(b.total)}</th></tr></table></div>${pend?'<p class="rd">Masih ada resep atau lab yang belum selesai.</p>':sel('b_m','Metode bayar',['Tunai','Transfer','QRIS','Asuransi'].map(x=>[x,x]))}`,pend?null:()=>{b.st='lunas';b.paid=now();b.metode=val('b_m');save();X();T('Pembayaran diterima');render()},'Bayar')}
function rst(){M('Reset data demo','Hapus semua data dan kembali ke data awal?',()=>{db=seed();save();X();render()},'Reset')}
function render(){if(me&&!MENU[me.role].includes(page))page=MENU[me.role][0];$('#app').innerHTML=me?shell(V[page]()):loginV()}
load();render();
</script></body></html>
